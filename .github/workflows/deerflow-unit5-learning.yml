name: DeerFlow Unit 5 learning lab
on:
  pull_request:
    paths:
      - "cases/speedrun-deer-flow/**"
      - ".github/workflows/deerflow-unit5-learning.yml"
  push:
    paths:
      - "cases/speedrun-deer-flow/**"
      - ".github/workflows/deerflow-unit5-learning.yml"

jobs:
  unit5:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: cases/speedrun-deer-flow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cases/speedrun-deer-flow/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Python tests
        run: python -m pytest tests/test_unit5_langgraph_sandbox.py tests/test_unit5_learning_experience.py -q
      - name: Generate offline teaching artifacts
        run: |
          python unit-5-tools-sandbox/main.py --learn
          test -s unit-5-tools-sandbox/learning-output/trace.json
          test -s unit-5-tools-sandbox/learning-output/replay.html
          test -s unit-5-tools-sandbox/learning-output/lesson.md
